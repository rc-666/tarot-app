name: tarot_app
description: Daily tarot cards from the real sky (MVP, Android).
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.38.1"

# Native plugins updated 22 Nov 2026 to current majors (older ones fail on current Gradle). On first setup run `flutter pub get`; if a constraint fails,
# run `flutter pub upgrade --major-versions` and fix any API changes `flutter analyze` reports.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  supabase_flutter: ^2.9.0
  shared_preferences: ^2.5.3
  connectivity_plus: ^7.3.2
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.0
  flutter_timezone: ^5.1.1
  google_mobile_ads: ^9.2.0
  posthog_flutter: ^5.56.2
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/library/
    - assets/places/
    - assets/deck/art/
    - assets/deck/frame/
    - assets/deck/back/
    - assets/demo/
  fonts:
    - family: Playfair Display
      fonts:
        - asset: assets/fonts/PlayfairDisplay_500Medium.ttf
          weight: 500
        - asset: assets/fonts/PlayfairDisplay_500Medium_Italic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/PlayfairDisplay_600SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlayfairDisplay_600SemiBold_Italic.ttf
          weight: 600
          style: italic
    - family: Noto Serif
      fonts:
        - asset: assets/fonts/NotoSerif_400Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSerif_400Regular_Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/NotoSerif_500Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSerif_500Medium_Italic.ttf
          weight: 500
          style: italic
    - family: Noto Sans
      fonts:
        - asset: assets/fonts/NotoSans_400Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSans_500Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSans_600SemiBold.ttf
          weight: 600
