name: tarot_app
description: Daily tarot cards from the real sky (MVP, Android).
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

# Versions are the latest known to the developer at writing time and were NOT resolved in this
# workspace (pub.dev unreachable). On first setup run `flutter pub get`; if a constraint fails,
# run `flutter pub upgrade --major-versions` and fix any API changes `flutter analyze` reports.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  supabase_flutter: ^2.9.0
  shared_preferences: ^2.5.3
  connectivity_plus: ^6.1.4
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
  flutter_timezone: ^4.1.0
  google_mobile_ads: ^5.3.1
  posthog_flutter: ^4.10.0
  url_launcher: ^6.3.1
  http: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/library/
    - assets/places/
    - assets/cards/
    - assets/demo/
  fonts:
    - family: Playfair Display
      fonts:
        - asset: assets/fonts/PlayfairDisplay_500Medium.ttf
          weight: 500
        - asset: assets/fonts/PlayfairDisplay_500Medium_Italic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/PlayfairDisplay_600SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlayfairDisplay_600SemiBold_Italic.ttf
          weight: 600
          style: italic
    - family: Noto Serif
      fonts:
        - asset: assets/fonts/NotoSerif_400Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSerif_400Regular_Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/NotoSerif_500Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSerif_500Medium_Italic.ttf
          weight: 500
          style: italic
    - family: Noto Sans
      fonts:
        - asset: assets/fonts/NotoSans_400Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSans_500Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSans_600SemiBold.ttf
          weight: 600
